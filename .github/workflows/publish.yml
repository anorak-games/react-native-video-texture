name: Publish

on:
    release:
        types: [published]

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm install -g npm@11
            - run: npm ci
            - run: npm test
            - name: Set version from release tag
              run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
            - name: Check whether this version is already on npm
              id: check
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  if npm view "@anorak-games/react-native-video-texture@$VERSION" version > /dev/null 2>&1; then
                      echo "published=true" >> "$GITHUB_OUTPUT"
                      echo "@anorak-games/react-native-video-texture@$VERSION already published — skipping publish"
                  fi
            - name: Publish to npm
              if: steps.check.outputs.published != 'true'
              run: npm publish --access public
            - name: Sync version back to main
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin main
                  git checkout -f -B main origin/main
                  git reset --hard origin/main
                  CURRENT=$(node -p "require('./package.json').version")
                  if [ "$CURRENT" != "$VERSION" ]; then
                      npm version "$VERSION" --no-git-tag-version --allow-same-version
                      git commit -am "chore: sync version to v$VERSION"
                      git push origin main
                  fi
